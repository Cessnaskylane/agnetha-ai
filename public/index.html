<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Agnetha</title>
  <meta name="description" content="Agnetha">
  <meta name="theme-color" content="#0c090e">
  <meta name="color-scheme" content="dark">
  <meta name="robots" content="noindex,nofollow">
  <link rel="icon" href="/favicon.png" type="image/png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,300;0,400;0,500;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css?v=aha3">
</head>
<body>
  <div class="grain" aria-hidden="true"></div>
  <img class="hero-photo" src="/hero.png?v=thumb2" alt="A silhouette of Agnetha" width="1920" height="1080">
  <p class="notice">for private use only</p>
  <main id="app" class="home">
    <header class="hero">
      <h1>AGNETHA</h1>
    </header>

    <section id="thread" class="thread" hidden>
      <div id="messages" class="messages" role="log" aria-live="polite" aria-relevant="additions" aria-label="Conversation"></div>
    </section>

    <form id="composer" class="composer" autocomplete="off">
      <label for="q" class="sr-only">Write to Agnetha</label>
      <input
        id="q"
        name="q"
        type="text"
        maxlength="2000"
        enterkeyhint="send"
        autocapitalize="sentences"
        autocomplete="off"
        spellcheck="true"
        placeholder=""
      >
      <button type="submit" class="send" aria-label="Send">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
          <path d="M5 12h12M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </form>
  </main>
  <noscript><p class="notice">This page needs a little JavaScript to talk.</p></noscript>
  <script src="/app.js?v=aha1" type="module"></script>
</body>
</html>
